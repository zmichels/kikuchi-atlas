name: Deploy Kikuchi Atlas gallery

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub prerelease containing chunks of the verified static gallery ZIP
        required: true
        default: atlas-gallery-web-0.2.0-draft.3
        type: string
      asset_glob:
        description: Glob matching the ordered static-gallery ZIP chunks to deploy
        required: true
        default: kikuchi-atlas-gallery-web-0.2.0-draft.3.zip.part-*
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kikuchi-atlas-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Download curated gallery payload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_GLOB: ${{ inputs.asset_glob }}
          EXPECTED_RELEASE_TAG: atlas-gallery-web-0.2.0-draft.3
          EXPECTED_ASSET_GLOB: kikuchi-atlas-gallery-web-0.2.0-draft.3.zip.part-*
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "$EXPECTED_RELEASE_TAG"
          test "$ASSET_GLOB" = "$EXPECTED_ASSET_GLOB"
          mkdir -p -- payload site
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_GLOB" \
            --dir payload
          mapfile -d '' chunks < <(
            find payload -maxdepth 1 -type f -name "$EXPECTED_ASSET_GLOB" -print0 |
              sort -z
          )
          test "${#chunks[@]}" -gt 1
          cat "${chunks[@]}" > gallery.zip
          test "$(sha256sum gallery.zip | cut -d ' ' -f1)" = \
            "214f49f383596a42301f8d9ef05304f792f70bc929c4238a90f100ec891d16c3"
          unzip -q gallery.zip -d site
          test -f site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
